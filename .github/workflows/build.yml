name: Build BIG IRL APP V2

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test and build debug APK
        run: gradle --no-daemon test assembleDebug --stacktrace

      - name: Upload reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BIG-IRL-APP-V2-build-reports
          path: "**/build/reports/**"
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BIG-IRL-APP-V2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
