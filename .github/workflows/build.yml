name: Build BIG IRL APP V2

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK and Meson
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          sudo apt-get update
          sudo apt-get install --yes cmake meson ninja-build
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test and build debug APK
        run: gradle --no-daemon test assembleDebug --stacktrace

      - name: Upload reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BIG-IRL-APP-V2-build-reports
          path: "**/build/reports/**"
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BIG-IRL-APP-V2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
