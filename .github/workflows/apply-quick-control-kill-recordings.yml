name: Apply Quick Control Kill Recordings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check patch ZIP
        shell: bash
        run: |
          set -euo pipefail

          test -f BIG-IRL-APP-V2-quick-control-kill-recordings.zip
          unzip -t BIG-IRL-APP-V2-quick-control-kill-recordings.zip

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf quick-control-patch
          mkdir quick-control-patch

          unzip -q \
            BIG-IRL-APP-V2-quick-control-kill-recordings.zip \
            -d quick-control-patch

          python3 \
            quick-control-patch/apply_quick_control_patch.py

          rm -rf quick-control-patch
          rm -f BIG-IRL-APP-V2-quick-control-kill-recordings.zip

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="app/src/main/AndroidManifest.xml"
          SERVICE="app/src/main/java/uk/co/bigirl/sender/StreamingService.kt"
          ACTIVITY="app/src/main/java/uk/co/bigirl/sender/MainActivity.kt"

          grep -F 'android:stopWithTask="true"' "$MANIFEST"
          grep -F 'override fun onTaskRemoved' "$SERVICE"
          grep -F 'return START_NOT_STICKY' "$SERVICE"
          grep -F 'KILL STREAM' "$SERVICE"
          grep -F 'STOP / KILL STREAM' "$ACTIVITY"
          grep -F 'Text("Recordings")' "$ACTIVITY"

          echo "PASS: quick controls and kill handling verified"

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m \
            "Add floating controls and emergency stream kill"

          git push
