name: Apply Floating Preview Compile Cellular Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find and check patch ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t PATCH_FILES < <(
            find . \
              -maxdepth 1 \
              -type f \
              -name 'BIG-IRL-APP-V2-floating-preview-compile-cellular-fix*.zip' \
              -print
          )

          if [[ "${#PATCH_FILES[@]}" -eq 0 ]]; then
            echo "FAIL: floating preview fix ZIP not found"
            exit 1
          fi

          if [[ "${#PATCH_FILES[@]}" -gt 1 ]]; then
            echo "FAIL: more than one matching patch ZIP exists"
            printf '%s\n' "${PATCH_FILES[@]}"
            exit 1
          fi

          PATCH_ZIP="${PATCH_FILES[0]}"

          echo "Patch found: $PATCH_ZIP"

          unzip -t "$PATCH_ZIP"

          printf '%s' "$PATCH_ZIP" \
            > /tmp/floating-preview-patch-path.txt

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail

          PATCH_ZIP="$(
            cat /tmp/floating-preview-patch-path.txt
          )"

          rm -rf floating-compile-cellular-fix
          mkdir floating-compile-cellular-fix

          unzip -q \
            "$PATCH_ZIP" \
            -d floating-compile-cellular-fix

          test -f \
            floating-compile-cellular-fix/apply_floating_compile_cellular_patch.py

          python3 \
            floating-compile-cellular-fix/apply_floating_compile_cellular_patch.py

          rm -rf floating-compile-cellular-fix
          rm -f "$PATCH_ZIP"

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="app/src/main/AndroidManifest.xml"
          SERVICE="app/src/main/java/uk/co/bigirl/sender/StreamingService.kt"

          grep -F \
            'android.permission.CHANGE_NETWORK_STATE' \
            "$MANIFEST"

          grep -F \
            'holdCellularWhileStreaming' \
            "$SERVICE"

          grep -F \
            'releaseCellularHold' \
            "$SERVICE"

          grep -F \
            'TRANSPORT_CELLULAR' \
            "$SERVICE"

          grep -F \
            'FLAG_NOT_TOUCHABLE' \
            "$SERVICE"

          if grep -Fq \
            'stream.removePreviewSurface' \
            "$SERVICE"; then
            echo "FAIL: unsupported removePreviewSurface call remains"
            exit 1
          fi

          echo "PASS: floating preview compile and cellular fix verified"

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m \
            "Fix floating preview and stream-scoped cellular request"

          git push
