name: Add Torch Support

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Patch StreamingService
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/uk/co/bigirl/sender/StreamingService.kt")
          text = path.read_text()

          if "import android.hardware.camera2.CameraManager" not in text:
              text = text.replace(
                  "import android.os.PowerManager",
                  "import android.os.PowerManager\nimport android.hardware.camera2.CameraManager"
              )

          text = text.replace(
              'val profile: StreamProfile = StreamProfile.MAXIMUM_1080P60,',
              'val profile: StreamProfile = StreamProfile.MAXIMUM_1080P60,\n        val torchEnabled: Boolean = false,'
          )

          insert_after = "fun updatePreviewSize(width: Int, height: Int) {"

          torch = '''

    fun toggleTorch(): Boolean {
        return try {
            val cameraManager =
                getSystemService(Context.CAMERA_SERVICE) as CameraManager

            val cameraId =
                cameraManager.cameraIdList.firstOrNull()

            if (cameraId == null) {
                updateMessage("Torch unavailable")
                return false
            }

            val enabled = !state.torchEnabled

            cameraManager.setTorchMode(
                cameraId,
                enabled,
            )

            state = state.copy(
                torchEnabled = enabled,
            )

            updateMessage(
                if (enabled) {
                    "Torch enabled"
                } else {
                    "Torch disabled"
                },
            )

            true
        } catch (error: Throwable) {
            Log.e(TAG, "Torch error", error)

            updateMessage(
                "Torch error: " +
                    (error.message ?: error.javaClass.simpleName),
            )

            false
        }
    }

'''

          if "fun toggleTorch()" not in text:
              pos = text.find(insert_after)
              text = text[:pos] + torch + text[pos:]

          path.write_text(text)
          PY

      - name: Patch MainActivity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/uk/co/bigirl/sender/MainActivity.kt")
          text = path.read_text()

          marker = '''
                Text("Active profile: ${streamState.profile.label}")
'''

          button = '''
                Button(
                    modifier = Modifier.fillMaxWidth(),
                    enabled = permissionsGranted,
                    onClick = {
                        service?.toggleTorch()
                    },
                ) {
                    Text(
                        if (streamState.torchEnabled) {
                            "💡 TORCH ON"
                        } else {
                            "💡 TORCH OFF"
                        },
                    )
                }

'''

          if "💡 TORCH" not in text:
              text = text.replace(marker, button + marker)

          path.write_text(text)
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Add torch support" || exit 0
          git push
