name: Apply Compact Overlay Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply compact overlay patch
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            BIG-IRL-APP-V2-compact-overlay-preview-fix.zip

          rm -rf compact-update
          mkdir compact-update

          unzip -q \
            BIG-IRL-APP-V2-compact-overlay-preview-fix.zip \
            -d compact-update

          SOURCE="compact-update/compact_patch_payload"
          TARGET="app/src/main/java/uk/co/bigirl/sender"

          test -f "$SOURCE/app/src/main/java/uk/co/bigirl/sender/MainActivity.kt"
          test -f "$SOURCE/app/src/main/java/uk/co/bigirl/sender/StreamingService.kt"
          test -f "$SOURCE/streambox/install-telemetry-api.sh"

          cp \
            "$SOURCE/app/src/main/java/uk/co/bigirl/sender/MainActivity.kt" \
            "$TARGET/MainActivity.kt"

          cp \
            "$SOURCE/app/src/main/java/uk/co/bigirl/sender/StreamingService.kt" \
            "$TARGET/StreamingService.kt"

          cp \
            "$SOURCE/streambox/install-telemetry-api.sh" \
            streambox/install-telemetry-api.sh

          rm -rf compact-update
          rm -f \
            BIG-IRL-APP-V2-compact-overlay-preview-fix.zip

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m \
            "Compact telemetry overlays and stabilise preview"

          git push
