name: Apply Bonding Configuration Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check patch ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f BIG-IRL-APP-V2-bonding-config-patch.zip
          unzip -t BIG-IRL-APP-V2-bonding-config-patch.zip

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf bonding-config-patch
          mkdir bonding-config-patch

          unzip -q \
            BIG-IRL-APP-V2-bonding-config-patch.zip \
            -d bonding-config-patch

          cp -a bonding-config-patch/. .

          rm -rf bonding-config-patch
          rm -f BIG-IRL-APP-V2-bonding-config-patch.zip

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            app/src/main/java/uk/co/bigirl/sender/BondingConfig.kt

          test -f BONDING-PATCH-NOTES.md

          grep -F \
            '145.40.153.191' \
            app/src/main/java/uk/co/bigirl/sender/BondingConfig.kt

          grep -F \
            'wifiPort: Int = 10010' \
            app/src/main/java/uk/co/bigirl/sender/BondingConfig.kt

          grep -F \
            'cellularPort: Int = 10011' \
            app/src/main/java/uk/co/bigirl/sender/BondingConfig.kt

          echo "Bonding configuration patch verified."

      - name: Commit applied patch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Apply StreamBox bonding configuration"
          git push
